name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libboost-dev libsqlite3-dev
      - name: Frontend checks
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Build daemon and launcher
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libboost-dev libsqlite3-dev
      - name: Build and test with ASan/UBSan
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DAEGIS_ENABLE_SANITIZERS=ON
          cmake --build build-sanitize -j2
          ctest --test-dir build-sanitize --output-on-failure
